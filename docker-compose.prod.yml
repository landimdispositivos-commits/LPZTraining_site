services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lpz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lpz_training
    volumes:
      - lpz_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpz -d lpz_training"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://lpz:${POSTGRES_PASSWORD}@db:5432/lpz_training
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - lpz_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  lpz_db_data:
  lpz_uploads:
